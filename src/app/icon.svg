<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Фавикон «ласточкин хвост» (соединение двух брусков) — активная вкладка.
       SVG-фавикон не видит CSS-переменные страницы, цвета заданы литералами
       из активной темы (taupe-cream): светлая тема = primary-darker #5E5040,
       тёмная = крем #F0EFEB. Вариант для неактивной вкладки:
       public/icon-inactive.svg (подменяется в FaviconSwitcher).
       (В XML-комментарии нельзя писать двойной дефис, поэтому имена
       переменных здесь без префикса.) -->
  <style>
    path { fill: #5E5040; }
    @media (prefers-color-scheme: dark) {
      path { fill: #F0EFEB; }
    }
  </style>
  <path d="M2 2 H8 V8 L16 6 V18 L8 16 V22 H2 Z"/>
  <path d="M10 2 V5.5 L18 3.5 V20.5 L10 18.5 V22 H22 V2 Z"/>
</svg>
